<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <title>Constructora Cuyo — avatar WhatsApp (640×640, recortado circular por WA)</title>

  <!-- Fondo terracota -->
  <rect width="640" height="640" fill="#B85C3E"/>

  <!-- Sutil viñeta para profundidad cuando se vea en círculo -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#C9694C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B85C3E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="640" fill="url(#vignette)"/>

  <!-- Monograma CC -->
  <text x="320" y="360"
        font-family="Fraunces, Playfair Display, Georgia, serif"
        font-weight="600"
        font-size="280"
        fill="#FAF4E8"
        text-anchor="middle"
        letter-spacing="0.01em">CC</text>

  <!-- Línea de marca debajo para reforzar identidad cuando se ve grande -->
  <text x="320" y="440"
        font-family="DM Sans, Inter, sans-serif"
        font-weight="500"
        font-size="30"
        fill="#E8D7BE"
        text-anchor="middle"
        letter-spacing="6">CONSTRUCTORA CUYO</text>

  <text x="320" y="478"
        font-family="DM Sans, Inter, sans-serif"
        font-weight="400"
        font-size="22"
        fill="#E8D7BE"
        opacity="0.75"
        text-anchor="middle"
        letter-spacing="4">MENDOZA</text>
</svg>
