<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140">
  <title>Constructora Cuyo · logo principal</title>
  <desc>Versión a color sobre fondo claro. Paleta: terracota + texto dark.</desc>

  <defs>
    <style>
      .lm-wordmark { font-family: 'Fraunces', 'Playfair Display', Georgia, serif; font-weight: 500; letter-spacing: -0.015em; }
      .lm-tagline  { font-family: 'DM Sans', 'Inter', sans-serif; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Monograma terracota AC -->
  <rect x="10" y="30" width="78" height="78" rx="14" fill="#B85C3E"/>
  <text x="49" y="83" font-family="Fraunces, Playfair Display, Georgia, serif" font-weight="600"
        font-size="34" fill="#FAF4E8" text-anchor="middle" letter-spacing="0.02em">CC</text>

  <!-- Wordmark -->
  <text x="105" y="76" class="lm-wordmark" font-size="44" fill="#2B231C">Constructora Cuyo</text>

  <!-- Tagline -->
  <text x="105" y="100" class="lm-tagline" font-size="11" fill="#5B4F44">Construcción en seco · Mendoza</text>
</svg>
